name: Backfill history, backtest & train

# Manually backfill past seasons from the open community FPL dataset
# (vaastav/Fantasy-Premier-League), run the backtest, (re)train the gradient-
# boosted model (xpts-v2), and commit the small results: the accuracy report
# (data/backfill/backtest.json) and the portable model (data/model_v2.json).
# The raw per-gameweek snapshots are regenerable and git-ignored.
#
# The live "Update data & deploy to Pages" workflow needs no ML libraries — it
# just scores the committed model_v2.json with a pure-Python evaluator. Rerun
# this workflow occasionally (e.g. once a season, or to add a new season) to
# refresh the model.
#
# Run it from the Actions tab → "Backfill history, backtest & train".

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated seasons to train/backtest on (>=2)'
        required: true
        default: '2022-23,2023-24,2024-25,2025-26'

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backfill seasons
        run: python scripts/backfill_history.py --seasons "${{ inputs.seasons }}" --out data/backfill

      - name: Backtest across backfilled seasons
        run: python scripts/backtest.py --history data/backfill --out data/backfill/backtest.json

      - name: Train gradient-boosted model (xpts-v2)
        run: |
          pip install --quiet scikit-learn
          python scripts/train_model.py --history data/backfill --out data/model_v2.json

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backfill/backtest.json data/model_v2.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(model): refresh backtest report & xpts-v2 model [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
